<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vinx extension settings</title>
<style>body{font:15px system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 16px}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:9px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font:inherit}button{margin-top:16px;padding:10px 16px;border:0;border-radius:8px;background:#6d5dfc;color:#fff;font:inherit;cursor:pointer}#msg{margin-top:12px}code{background:#8883;padding:1px 5px;border-radius:4px}</style></head>
<body>
  <h1>Vinx extension</h1>
  <p>In Vinx, open <b>Settings → Quick capture</b>. Copy your capture URL and create a device key, then paste both here. The key is stored only in this browser.</p>
  <label for="url">Capture URL</label><input id="url" placeholder="https://YOUR-PROJECT.supabase.co/functions/v1/capture" autocomplete="off">
  <label for="key">Device key</label><input id="key" type="password" placeholder="mm_…" autocomplete="off">
  <button id="save">Save</button> <button id="test" style="background:#888">Send a test</button>
  <div id="msg" role="status"></div>
  <script type="module" src="options.js"></script>
</body></html>
